<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="118" role="img" aria-labelledby="title">
  <title id="title">Hello there! I’m Cosmin Robert.</title>
  <style>
    svg { --ink: #24292f; --accent: #116b59; }
    text { font-family: ui-monospace, "Cascadia Mono", Consolas, "Liberation Mono", monospace; }
    .hello { fill: var(--accent); font-size: 30px; font-weight: 600; }
    .name { fill: var(--ink); font-size: 54px; font-weight: 700; letter-spacing: -1.8px; }
    .typing-window { transform-origin: 0 0; }
    @media (prefers-color-scheme: dark) {
      svg { --ink: #f0f6fc; --accent: #94dfc7; }
    }
    @media (max-width: 390px) {
      .hello { font-size: clamp(16px, 6vw, 24px); }
      .name { font-size: clamp(23px, 10.4vw, 40px); letter-spacing: -1px; }
    }
    @media (prefers-reduced-motion: no-preference) {
      .typing-window { animation: type 1.45s steps(18, end) both; }
      @keyframes type { from { transform: scaleX(0); } to { transform: scaleX(1); } }
    }
  </style>
  <defs>
    <clipPath id="typed" clipPathUnits="objectBoundingBox">
      <rect class="typing-window" width="1" height="1"/>
    </clipPath>
  </defs>
  <text class="hello" x="0" y="37" clip-path="url(#typed)">&gt; Hello there! I’m</text>
  <text class="name" x="0" y="100">Cosmin Robert</text>
</svg>
